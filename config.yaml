# Правила автоматизаций. Секретов здесь нет: токены и пароли — в переменных
# окружения (.env.example). Все параметры и значения по умолчанию — словарь
# defaults в hub/automations/<файл>.py. Имя записи — как автоматизация видна
# в журнале и API; uses — какой класс взять (по умолчанию = имени).
#
# После правки: python -m hub check — сверит статусы, шаблоны и доп. поля
# с вашим МойСклад и подскажет, что не так.

automations:

  # ── отгрузки ──────────────────────────────────────────────────────────────

  # каждый день в 17:00 — УПД за сегодня покупателям на почту, одно письмо на контрагента
  daily_upd:
    enabled: true
    at: "17:00"                       # по Москве
    template: "УПД"                   # python -m hub templates shipments
    only_applicable: true             # только проведённые (отгруженные)
    only_with_order: true             # только созданные по заказу покупателя
    company_types: [legal, entrepreneur]   # юрлица и ИП (физлица — нет)
    name_prefixes: ["ООО", "ИП"]      # и по названию: «ООО …», «ИП …» (АО, ПАО — не берём)
    states: []                        # только эти статусы отгрузки; пусто — любые
    exclude_states: []                # например ["ОТПРАВЛЕН В ЭДО"], если по ЭДО уже ушло
    email_cc: []                      # копия себе/бухгалтерии
    report_chats: []                  # Telegram-чаты для отчёта: сколько ушло, у кого нет e-mail

  # УПД сразу по статусу отгрузки (по событию, а не по расписанию)
  send_upd:
    enabled: false
    state: "ОТПРАВЛЕН"                # python -m hub states shipments
    template: "УПД"
    channels: [email]                 # email | telegram | webhook
    email_cc: []
    mark_field: "УПД отправлен"       # доп. поле отгрузки (python -m hub setup)
    with_link: false
    # state_after: "УПД отправлен"    # сменить статус отгрузки после отправки

  # заказ идёт следом за отгрузкой: отгрузили — заказ «Отгружен»
  sync_order_state:
    enabled: false
    state: "Отгружен"
    order_state: "Отгружен"
    only_from: ["Подтверждён", "Собран"]   # не трогать «Отменён» и прочее ручное

  # ── заказы ────────────────────────────────────────────────────────────────

  # счёт покупателю, когда заказ подтверждён
  order_invoice:
    enabled: false
    uses: send_document
    entity: customerorder
    state: "Подтверждён"
    template: "Счет покупателю"       # python -m hub templates orders
    file_title: "Счёт"
    channels: [email]

  # складу в Telegram: заказ собран
  order_assembled:
    enabled: false
    uses: notify
    entity: customerorder
    when: state_changed               # state | created | state_changed
    state: "Собран"
    telegram_chats: ["-1001234567890"]
    text: "📦 Заказ {number} собран · {agent} · {sum} ₽ · {address}"

  # переход в сборку пишется в базу. В 07:00 — новый XLSX на Диск.
  # Файл после публикации не меняется. Как включить — docs/yandex-logistics.md
  logistics_sheet:
    enabled: false
    entity: customerorder
    state: "ПОДТВЕРЖДЕН / ОЖИДАЕТ СБОРКИ"
    state_id: ""                     # если задан и у заказа есть id статуса — сравнение по id
    hours_field: ""                  # доп. поле заказа; пусто — «Часы приёмки» не пишем
    phone_field: ""                  # доп. поле телефона на заказе; пусто — городской, затем контакт
    notify_chats: []                 # поздний заказ; пусто — только запись в журнале

  logistics_publish:
    enabled: false
    at: "07:00"                      # Москва. Утвердить до боевого включения
    folder: ""                       # disk:/папка-пробы , не секрет и не боевая папка

  # ── контрагенты ───────────────────────────────────────────────────────────

  # новому контрагенту — значения доп. полей и статус
  new_counterparty:
    enabled: false
    uses: counterparty_fields
    when: created                     # created | any
    fields:                           # python -m hub fields counterparties
      "Канал продаж": "HoReCa"
      "Источник": "МойСклад"
    set_state: "Новый"
    only_empty: true                  # не перетирать то, что ввели руками

  # ── по расписанию ─────────────────────────────────────────────────────────

  daily_digest:
    enabled: false
    at: "18:00"                       # по Москве
    types: [customerorder, demand]
    telegram_chats: ["-1001234567890"]

# Telegram-бот и POST /api/ask: вопросы по МойСклад обычным языком, только чтение.
# Включается переменными ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, HUB_BOT_CHATS (.env.example).
bot:
  # «покупатели», отгрузки которым — не продажа, а перемещение (например, на Озон):
  # в выручке и долгах их не считаем, пока не спросят явно. Часть названия.
  internal_counterparties: ["ИНТЕРНЕТ РЕШЕНИЯ"]
  # доп. поле со сроком оплаты («Отсрочка 14 кд», «Предоплата») — у отгрузки, заказа
  # или контрагента; из него неоплаченные отгрузки получают срок и просрочку
  payment_field: "Оплата"
