# Правки хаба через ИИ: напишите задачу в issue или комментарии с @claude —
# Claude Code сделает изменения в отдельной ветке и откроет pull request.
# Тесты (ci.yml) проверят PR, в main и на Dockhost попадает только то, что вы смёрджили.
#
# Нужно один раз: приложение Claude установлено на репозиторий (github.com/apps/claude)
# и секрет репозитория ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# Запускать могут только участники с правом записи в репозиторий.
name: claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Bash(python -m pytest:*),Bash(ruff check:*)"
